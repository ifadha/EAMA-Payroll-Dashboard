<!DOCTYPE html>
<html class="light" lang="en">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />

    <title>EAMA Payroll - Login</title>

    <!-- Google Fonts -->
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
        rel="stylesheet"
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect" />

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    />

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

    <!-- Supabase JS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- Tailwind Configuration -->
    <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "secondary-container": "#e3e1ee",
                        "outline-variant": "#cac4d3",
                        "on-surface-variant": "#494552",
                        "surface-container": "#efecff",
                        "surface": "#fcf8ff",
                        "error": "#ba1a1a",
                        "primary": "#644aae",
                        "primary-container": "#7d63c8",
                        "on-primary": "#ffffff",
                        "surface-container-lowest": "#ffffff",
                        "on-surface": "#181934",
                        "outline": "#7a7583"
                    },
                    fontFamily: {
                        "body-md": ["Inter", "sans-serif"],
                        "label-md": ["Inter", "sans-serif"],
                        "headline-md": ["Inter", "sans-serif"],
                        "label-sm": ["Inter", "sans-serif"]
                    }
                }
            }
        };
    </script>
</head>

<body
    class="bg-surface text-on-surface min-h-screen flex items-center justify-center p-4 antialiased font-body-md"
>

    <!-- Background -->
    <div
        class="fixed inset-0 pointer-events-none z-0 opacity-40 mix-blend-multiply"
        style="
            background-image:
                radial-gradient(
                    circle at 100% 0%,
                    rgba(100,74,174,0.08) 0%,
                    transparent 50%
                ),
                radial-gradient(
                    circle at 0% 100%,
                    rgba(93,93,104,0.05) 0%,
                    transparent 40%
                );
        "
    ></div>

    <!-- Login Container -->
    <main class="w-full max-w-[440px] z-10">

        <div
            class="bg-surface-container-lowest rounded-xl shadow-[0_8px_30px_rgba(0,0,0,0.04)] border border-outline-variant/30 overflow-hidden relative"
        >

            <!-- Top Accent -->
            <div class="h-1.5 w-full bg-primary"></div>

            <div class="p-8">

                <!-- Logo / Heading -->
                <div class="flex flex-col items-center mb-8 text-center">

                    <div
                        class="w-16 h-16 bg-surface-container flex items-center justify-center mb-4 rounded-xl border border-outline-variant/30 text-primary shadow-sm"
                    >
                        <span
                            class="material-symbols-outlined text-3xl"
                            style="font-variation-settings: 'FILL' 1;"
                        >
                            account_balance
                        </span>
                    </div>

                    <h1 class="font-headline-md text-2xl font-bold text-on-surface mb-1">
                        EAMA Payroll
                    </h1>

                    <p class="text-sm text-on-surface-variant">
                        Management System
                    </p>

                </div>

                <!-- Error Banner -->
                <div
                    id="error-banner"
                    class="hidden mb-4 p-3 bg-red-50 border border-red-200 text-error text-sm rounded-lg flex items-center gap-2"
                >
                    <span class="material-symbols-outlined text-[18px]">
                        error
                    </span>

                    <span id="error-text">
                        Invalid login credentials.
                    </span>
                </div>

                <!-- Login Form -->
                <form id="login-form" class="space-y-5">

                    <!-- Email -->
                    <div class="space-y-1.5">

                        <label
                            class="block text-xs font-semibold text-on-surface-variant uppercase tracking-wider"
                            for="email"
                        >
                            Work Email
                        </label>

                        <div class="relative">

                            <span
                                class="material-symbols-outlined text-outline text-[20px] absolute left-3 top-1/2 -translate-y-1/2 pointer-events-none"
                            >
                                mail
                            </span>

                            <input
                                class="block w-full pl-10 pr-3 py-2.5 bg-surface-container-lowest border border-outline-variant rounded-lg text-sm text-on-surface placeholder:text-outline focus:ring-2 focus:ring-primary/20 focus:border-primary transition-colors"
                                id="email"
                                name="email"
                                placeholder="admin@eamagarments.com"
                                required
                                type="email"
                                autocomplete="email"
                            />

                        </div>

                    </div>

                    <!-- Password -->
                    <div class="space-y-1.5">

                        <div class="flex items-center justify-between">

                            <label
                                class="block text-xs font-semibold text-on-surface-variant uppercase tracking-wider"
                                for="password"
                            >
                                Password
                            </label>

                            <a
                                class="text-xs text-primary hover:underline"
                                href="javascript:void(0)"
                                onclick="showToast('Contact IT Administrator for password reset.', 'info')"
                            >
                                Forgot password?
                            </a>

                        </div>

                        <div class="relative">

                            <span
                                class="material-symbols-outlined text-outline text-[20px] absolute left-3 top-1/2 -translate-y-1/2 pointer-events-none"
                            >
                                lock
                            </span>

                            <input
                                class="block w-full pl-10 pr-10 py-2.5 bg-surface-container-lowest border border-outline-variant rounded-lg text-sm text-on-surface placeholder:text-outline focus:ring-2 focus:ring-primary/20 focus:border-primary transition-colors"
                                id="password"
                                name="password"
                                placeholder="••••••••"
                                required
                                type="password"
                                autocomplete="current-password"
                            />

                            <button
                                aria-label="Toggle password visibility"
                                class="absolute inset-y-0 right-0 pr-3 flex items-center text-outline hover:text-on-surface-variant"
                                type="button"
                                id="toggle-password"
                            >
                                <span class="material-symbols-outlined text-[20px]">
                                    visibility
                                </span>
                            </button>

                        </div>

                    </div>

                    <!-- Submit -->
                    <button
                        id="submit-btn"
                        class="w-full flex justify-center items-center py-2.5 px-4 rounded-lg font-medium text-sm text-on-primary bg-primary hover:bg-primary-container transition-colors shadow-sm active:scale-[0.98]"
                        type="submit"
                    >
                        <span>Sign In to Dashboard</span>
                    </button>

                </form>

            </div>

            <!-- Footer -->
            <div
                class="bg-surface-container/50 px-6 py-4 border-t border-outline-variant/30 text-center flex items-center justify-center gap-2"
            >
                <span class="material-symbols-outlined text-outline text-[16px]">
                    shield_lock
                </span>

                <p class="text-xs text-on-surface-variant">
                    Authorized EAMA Personnel Only. Access is logged.
                </p>
            </div>

        </div>

    </main>

    <!-- Shared Supabase Client -->
    <script src="supabase-client.js"></script>

    <script>

        // ============================================================
        // Password Visibility Toggle
        // ============================================================

        document
            .getElementById('toggle-password')
            .addEventListener('click', () => {

                const passwordInput =
                    document.getElementById('password');

                const icon =
                    document.querySelector('#toggle-password span');

                if (passwordInput.type === 'password') {

                    passwordInput.type = 'text';
                    icon.textContent = 'visibility_off';

                } else {

                    passwordInput.type = 'password';
                    icon.textContent = 'visibility';

                }

            });


        // ============================================================
        // Login
        // ============================================================

        document
            .getElementById('login-form')
            .addEventListener('submit', async (e) => {

                e.preventDefault();

                const email =
                    document.getElementById('email').value.trim();

                const password =
                    document.getElementById('password').value;

                const btn =
                    document.getElementById('submit-btn');

                const errorBanner =
                    document.getElementById('error-banner');

                const errorText =
                    document.getElementById('error-text');


                // Hide previous error
                errorBanner.classList.add('hidden');


                // Disable button
                btn.disabled = true;

                btn.innerHTML =
                    `<span class="inline-block animate-spin mr-2">⏳</span> Authenticating...`;


                try {

                    // ========================================================
                    // Make sure the EAMA Supabase client exists
                    // ========================================================

                    if (
                        !window.eamaSupabase ||
                        typeof window.eamaSupabase.from !== 'function'
                    ) {
                        throw new Error(
                            'Supabase is not initialized correctly. Please check supabase-client.js.'
                        );
                    }


                    // ========================================================
                    // Sign In
                    // ========================================================

                    const {
                        data,
                        error
                    } = await window.eamaSupabase.auth.signInWithPassword({
                        email,
                        password
                    });


                    if (error) {
                        throw error;
                    }


                    // Make sure a user was returned
                    if (!data || !data.user) {
                        throw new Error(
                            'Login failed. No authenticated user was returned.'
                        );
                    }


                    // ========================================================
                    // Look Up User Profile
                    // ========================================================

                    let {
                        data: profile,
                        error: profileError
                    } = await window.eamaSupabase
                        .from('user_profiles')
                        .select('role')
                        .eq('id', data.user.id)
                        .maybeSingle();


                    if (profileError) {
                        throw profileError;
                    }


                    if (!profile) {
                        await window.eamaSupabase.auth.signOut();

                        throw new Error(
                            'No EAMA profile is linked to this account. Contact an administrator to provision access.'
                        );

                    }


                    // ========================================================
                    // Successful Login
                    // ========================================================

                    showToast(
                        'Authentication successful. Redirecting...',
                        'success'
                    );


                    // ========================================================
                    // Redirect Based On Role
                    // ========================================================

                    setTimeout(() => {

                        if (profile.role === 'employee') {

                            window.location.href = 'demo.html';

                        } else {

                            window.location.href = 'dashboard.html';

                        }

                    }, 400);


                } catch (err) {

                    console.error('Login error:', err);


                    errorText.textContent =
                        err?.message ||
                        'Invalid email or password.';


                    errorBanner.classList.remove('hidden');


                } finally {

                    btn.disabled = false;

                    btn.innerHTML =
                        `<span>Sign In to Dashboard</span>`;

                }

            });

    </script>

</body>

</html>
